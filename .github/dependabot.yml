version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      production-minor-and-patch:
        dependency-type: production
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        dependency-type: development
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - '*'
